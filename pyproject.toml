[project]
name = "clarityflow"
version = "0.1.0"
description = "Video upscaling powered by Real-ESRGAN"
requires-python = ">=3.10"

[project.scripts]
clarityflow = "clarityflow.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clarityflow*"]
